<svg xmlns="http://www.w3.org/2000/svg" width="960" height="380" viewBox="0 0 960 380" role="img" aria-labelledby="title desc"><title id="title">树边倍增与终端捷径</title><desc id="desc">一棵三终端星形树每条边走两次，总费用六；终端距离环每条边费用二，总费用也为六。</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="#536274"/></marker></defs><rect width="960" height="380" fill="white"/><g font-family="PingFang SC, Arial, sans-serif"><line x1="200" y1="175" x2="80" y2="65" stroke="#536274" stroke-width="3" /><line x1="200" y1="175" x2="80" y2="285" stroke="#536274" stroke-width="3" /><line x1="200" y1="175" x2="350" y2="175" stroke="#536274" stroke-width="3" /><line x1="207" y1="175" x2="87" y2="65" stroke="#19766e" stroke-width="3" stroke-dasharray="7 5"/><line x1="207" y1="175" x2="87" y2="285" stroke="#19766e" stroke-width="3" stroke-dasharray="7 5"/><line x1="207" y1="180" x2="350" y2="180" stroke="#19766e" stroke-width="3" stroke-dasharray="7 5"/><circle cx="200" cy="175" r="27" fill="#e9f5f1" stroke="#245b91" stroke-width="2"/><text x="200" y="182" font-size="21" fill="#203247" text-anchor="middle">s</text><circle cx="80" cy="65" r="27" fill="#eaf2f9" stroke="#245b91" stroke-width="2"/><text x="80" y="72" font-size="21" fill="#203247" text-anchor="middle">r₁</text><circle cx="80" cy="285" r="27" fill="#eaf2f9" stroke="#245b91" stroke-width="2"/><text x="80" y="292" font-size="21" fill="#203247" text-anchor="middle">r₂</text><circle cx="350" cy="175" r="27" fill="#eaf2f9" stroke="#245b91" stroke-width="2"/><text x="350" y="182" font-size="21" fill="#203247" text-anchor="middle">r₃</text><line x1="650" y1="65" x2="650" y2="285" stroke="#536274" stroke-width="3" /><line x1="650" y1="65" x2="850" y2="175" stroke="#536274" stroke-width="3" /><line x1="650" y1="285" x2="850" y2="175" stroke="#536274" stroke-width="3" /><circle cx="650" cy="65" r="27" fill="#eaf2f9" stroke="#245b91" stroke-width="2"/><text x="650" y="72" font-size="21" fill="#203247" text-anchor="middle">r₁</text><circle cx="650" cy="285" r="27" fill="#eaf2f9" stroke="#245b91" stroke-width="2"/><text x="650" y="292" font-size="21" fill="#203247" text-anchor="middle">r₂</text><circle cx="850" cy="175" r="27" fill="#eaf2f9" stroke="#245b91" stroke-width="2"/><text x="850" y="182" font-size="21" fill="#203247" text-anchor="middle">r₃</text><text x="430" y="170" font-size="24" fill="#19766e" >捷径</text><line x1="420" y1="195" x2="550" y2="195" stroke="#536274" stroke-width="3" marker-end="url(#arrow)"/><text x="185" y="330" font-size="23" fill="#203247" >2c(T*) = 6</text><text x="650" y="330" font-size="23" fill="#203247" >距离环长 = 6</text></g></svg>
