<svg xmlns="http://www.w3.org/2000/svg" width="960" height="350" viewBox="0 0 960 350" role="img" aria-labelledby="title desc"><title id="title">完全 r 元超图的覆盖</title><desc id="desc">取 n 等于五、r 等于三；若漏掉三个顶点，这三个点本身就是未覆盖超边。</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="#536274"/></marker></defs><rect width="960" height="350" fill="white"/><g font-family="PingFang SC, Arial, sans-serif"><circle cx="100" cy="110" r="27" fill="#e9f5f1" stroke="#245b91" stroke-width="2"/><text x="100" y="117" font-size="21" fill="#203247" text-anchor="middle">1</text><circle cx="280" cy="110" r="27" fill="#e9f5f1" stroke="#245b91" stroke-width="2"/><text x="280" y="117" font-size="21" fill="#203247" text-anchor="middle">2</text><circle cx="460" cy="110" r="27" fill="#fff1eb" stroke="#245b91" stroke-width="2"/><text x="460" y="117" font-size="21" fill="#203247" text-anchor="middle">3</text><circle cx="640" cy="110" r="27" fill="#fff1eb" stroke="#245b91" stroke-width="2"/><text x="640" y="117" font-size="21" fill="#203247" text-anchor="middle">4</text><circle cx="820" cy="110" r="27" fill="#fff1eb" stroke="#245b91" stroke-width="2"/><text x="820" y="117" font-size="21" fill="#203247" text-anchor="middle">5</text><rect x="400" y="60" width="480" height="100" rx="45" fill="none" stroke="#b94f3d" stroke-width="3" stroke-dasharray="8 6"/><text x="65" y="205" font-size="26" fill="#b94f3d" >只选 2 个：漏下 {3, 4, 5}，存在未覆盖超边。</text><text x="65" y="270" font-size="25" fill="#19766e" >至少选 n − r + 1 = 3 个，最多漏下 r − 1 = 2 个。</text></g></svg>
