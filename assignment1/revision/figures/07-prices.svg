<svg xmlns="http://www.w3.org/2000/svg" width="960" height="390" viewBox="0 0 960 390" role="img" aria-labelledby="title desc"><title id="title">贪心支配集的价格分摊</title><desc id="desc">四顶点路径的费用分别为二三二二。先选 c，新覆盖三个顶点，每个分摊三分之二，再选 a。</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="#536274"/></marker></defs><rect width="960" height="390" fill="white"/><g font-family="PingFang SC, Arial, sans-serif"><line x1="180" y1="100" x2="380" y2="100" stroke="#536274" stroke-width="3" /><line x1="380" y1="100" x2="580" y2="100" stroke="#536274" stroke-width="3" /><line x1="580" y1="100" x2="780" y2="100" stroke="#536274" stroke-width="3" /><circle cx="180" cy="100" r="27" fill="#eaf2f9" stroke="#245b91" stroke-width="2"/><text x="180" y="107" font-size="21" fill="#203247" text-anchor="middle">a</text><circle cx="380" cy="100" r="27" fill="#eaf2f9" stroke="#245b91" stroke-width="2"/><text x="380" y="107" font-size="21" fill="#203247" text-anchor="middle">b</text><circle cx="580" cy="100" r="27" fill="#e9f5f1" stroke="#245b91" stroke-width="2"/><text x="580" y="107" font-size="21" fill="#203247" text-anchor="middle">c</text><circle cx="780" cy="100" r="27" fill="#eaf2f9" stroke="#245b91" stroke-width="2"/><text x="780" y="107" font-size="21" fill="#203247" text-anchor="middle">d</text><text x="142" y="155" font-size="22" fill="#203247" >cₐ = 2</text><text x="342" y="155" font-size="22" fill="#203247" >c_b = 3</text><text x="542" y="155" font-size="22" fill="#203247" >c_c = 2</text><text x="742" y="155" font-size="22" fill="#203247" >c_d = 2</text><rect x="70" y="205" width="820" height="65" rx="12" fill="#e9f5f1" stroke="#245b91" stroke-width="2"/><text x="480" y="244.5" font-size="22" fill="#203247" text-anchor="middle">第 1 步选 c：b、c、d 各分摊 2/3</text><rect x="70" y="290" width="820" height="65" rx="12" fill="#eaf2f9" stroke="#245b91" stroke-width="2"/><text x="480" y="329.5" font-size="22" fill="#203247" text-anchor="middle">第 2 步选 a：a 分摊 2；总价 2 + 3 × 2/3 = 4</text></g></svg>
