<svg xmlns="http://www.w3.org/2000/svg" width="960" height="350" viewBox="0 0 960 350" role="img" aria-labelledby="title desc"><title id="title">超边与阈值覆盖</title><desc id="desc">两个超边共享顶点 b，选择 b 可以同时覆盖两条超边。</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="#536274"/></marker></defs><rect width="960" height="350" fill="white"/><g font-family="PingFang SC, Arial, sans-serif"><ellipse cx="300" cy="155" rx="245" ry="105" fill="#eaf2f9" stroke="#245b91" stroke-width="3"/><ellipse cx="635" cy="155" rx="245" ry="105" fill="#e9f5f1" fill-opacity="0.75" stroke="#19766e" stroke-width="3"/><circle cx="150" cy="155" r="27" fill="#eaf2f9" stroke="#245b91" stroke-width="2"/><text x="150" y="162" font-size="21" fill="#203247" text-anchor="middle">a</text><circle cx="465" cy="155" r="27" fill="#fff1eb" stroke="#245b91" stroke-width="2"/><text x="465" y="162" font-size="21" fill="#203247" text-anchor="middle">b</text><circle cx="795" cy="155" r="27" fill="#eaf2f9" stroke="#245b91" stroke-width="2"/><text x="795" y="162" font-size="21" fill="#203247" text-anchor="middle">d</text><circle cx="300" cy="210" r="27" fill="#eaf2f9" stroke="#245b91" stroke-width="2"/><text x="300" y="217" font-size="21" fill="#203247" text-anchor="middle">c</text><circle cx="635" cy="210" r="27" fill="#eaf2f9" stroke="#245b91" stroke-width="2"/><text x="635" y="217" font-size="21" fill="#203247" text-anchor="middle">e</text><text x="100" y="35" font-size="24" fill="#245b91" >e₁ = {a, b, c}</text><text x="620" y="35" font-size="24" fill="#19766e" >e₂ = {b, d, e}</text><text x="235" y="315" font-size="24" fill="#203247" >选择 b：每条超边中至少有一个被选顶点。</text></g></svg>
