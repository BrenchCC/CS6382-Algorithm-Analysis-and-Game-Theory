<svg xmlns="http://www.w3.org/2000/svg" width="960" height="350" viewBox="0 0 960 350" role="img" aria-labelledby="title desc"><title id="title">贪心与离线最优的容量使用</title><desc id="desc">顶点 a 有两个槽位，b 有一个。贪心将前两个请求放到 a；最优把第一个请求放到 b。</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="#536274"/></marker></defs><rect width="960" height="350" fill="white"/><g font-family="PingFang SC, Arial, sans-serif"><text x="75" y="40" font-size="27" fill="#245b91" >贪心 ALG = 2</text><text x="545" y="40" font-size="27" fill="#19766e" >离线 OPT = 3</text><rect x="60" y="80" width="170" height="65" rx="12" fill="#eaf2f9" stroke="#245b91" stroke-width="2"/><text x="145" y="119.5" font-size="22" fill="#203247" text-anchor="middle">a：u₁</text><rect x="60" y="165" width="170" height="65" rx="12" fill="#eaf2f9" stroke="#245b91" stroke-width="2"/><text x="145" y="204.5" font-size="22" fill="#203247" text-anchor="middle">a：u₂</text><rect x="260" y="80" width="170" height="65" rx="12" fill="#fff1eb" stroke="#245b91" stroke-width="2"/><text x="345" y="119.5" font-size="22" fill="#203247" text-anchor="middle">b：空闲</text><text x="80" y="290" font-size="24" fill="#b94f3d" >u₃ 只连 a → 拒绝</text><rect x="530" y="80" width="170" height="65" rx="12" fill="#e9f5f1" stroke="#245b91" stroke-width="2"/><text x="615" y="119.5" font-size="22" fill="#203247" text-anchor="middle">a：u₂</text><rect x="530" y="165" width="170" height="65" rx="12" fill="#e9f5f1" stroke="#245b91" stroke-width="2"/><text x="615" y="204.5" font-size="22" fill="#203247" text-anchor="middle">a：u₃</text><rect x="730" y="80" width="170" height="65" rx="12" fill="#e9f5f1" stroke="#245b91" stroke-width="2"/><text x="815" y="119.5" font-size="22" fill="#203247" text-anchor="middle">b：u₁</text><text x="540" y="290" font-size="24" fill="#19766e" >把选择多的 u₁ 留给 b。</text></g></svg>
