<svg xmlns="http://www.w3.org/2000/svg" width="960" height="350" viewBox="0 0 960 350" role="img" aria-labelledby="title desc"><title id="title">租买决策时间线</title><desc id="desc">购买费用十，租金三四五一；前两日租，第三日买，不付第三日租金。</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="#536274"/></marker></defs><rect width="960" height="350" fill="white"/><g font-family="PingFang SC, Arial, sans-serif"><line x1="90" y1="115" x2="870" y2="115" stroke="#536274" stroke-width="3" marker-end="url(#arrow)"/><circle cx="150" cy="115" r="27" fill="#eaf2f9" stroke="#245b91" stroke-width="2"/><text x="150" y="122" font-size="21" fill="#203247" text-anchor="middle">1</text><circle cx="370" cy="115" r="27" fill="#eaf2f9" stroke="#245b91" stroke-width="2"/><text x="370" y="122" font-size="21" fill="#203247" text-anchor="middle">2</text><circle cx="590" cy="115" r="27" fill="#fff1eb" stroke="#245b91" stroke-width="2"/><text x="590" y="122" font-size="21" fill="#203247" text-anchor="middle">3</text><circle cx="810" cy="115" r="27" fill="#eaf2f9" stroke="#245b91" stroke-width="2"/><text x="810" y="122" font-size="21" fill="#203247" text-anchor="middle">4</text><text x="105" y="60" font-size="22" fill="#203247" >第 1 天</text><text x="325" y="60" font-size="22" fill="#203247" >第 2 天</text><text x="545" y="60" font-size="22" fill="#203247" >第 3 天</text><text x="765" y="60" font-size="22" fill="#203247" >第 4 天</text><text x="105" y="185" font-size="26" fill="#203247" >租 3</text><text x="325" y="185" font-size="26" fill="#203247" >租 4</text><text x="545" y="185" font-size="26" fill="#b94f3d" >买 10</text><text x="765" y="185" font-size="26" fill="#19766e" >免费</text><text x="95" y="245" font-size="21" fill="#203247" >已付 R = 3</text><text x="315" y="245" font-size="21" fill="#203247" >已付 R = 7</text><text x="535" y="245" font-size="21" fill="#b94f3d" >7 + 5 ≥ 10</text><text x="95" y="315" font-size="25" fill="#203247" >ALG = 3 + 4 + 10 = 17；OPT = min{10, 13} = 10。</text></g></svg>
