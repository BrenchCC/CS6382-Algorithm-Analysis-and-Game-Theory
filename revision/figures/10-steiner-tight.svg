<svg xmlns="http://www.w3.org/2000/svg" width="960" height="380" viewBox="0 0 960 380" role="img" aria-labelledby="title desc"><title id="title">Steiner 树紧例</title><desc id="desc">三个终端与中心相连的边费用为一，终端间边费用为二减 epsilon。</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="#536274"/></marker></defs><rect width="960" height="380" fill="white"/><g font-family="PingFang SC, Arial, sans-serif"><line x1="300" y1="190" x2="110" y2="70" stroke="#19766e" stroke-width="3" /><line x1="300" y1="190" x2="110" y2="310" stroke="#19766e" stroke-width="3" /><line x1="300" y1="190" x2="480" y2="190" stroke="#19766e" stroke-width="3" /><line x1="110" y1="70" x2="110" y2="310" stroke="#536274" stroke-width="3" stroke-dasharray="7 5"/><line x1="110" y1="70" x2="480" y2="190" stroke="#536274" stroke-width="3" stroke-dasharray="7 5"/><line x1="110" y1="310" x2="480" y2="190" stroke="#536274" stroke-width="3" stroke-dasharray="7 5"/><circle cx="300" cy="190" r="27" fill="#e9f5f1" stroke="#245b91" stroke-width="2"/><text x="300" y="197" font-size="21" fill="#203247" text-anchor="middle">s</text><circle cx="110" cy="70" r="27" fill="#eaf2f9" stroke="#245b91" stroke-width="2"/><text x="110" y="77" font-size="21" fill="#203247" text-anchor="middle">r₁</text><circle cx="110" cy="310" r="27" fill="#eaf2f9" stroke="#245b91" stroke-width="2"/><text x="110" y="317" font-size="21" fill="#203247" text-anchor="middle">r₂</text><circle cx="480" cy="190" r="27" fill="#eaf2f9" stroke="#245b91" stroke-width="2"/><text x="480" y="197" font-size="21" fill="#203247" text-anchor="middle">r₃</text><text x="175" y="110" font-size="25" fill="#19766e" >1</text><text x="175" y="280" font-size="25" fill="#19766e" >1</text><text x="385" y="175" font-size="25" fill="#19766e" >1</text><text x="550" y="85" font-size="25" fill="#19766e" >实线：中心边，费用 1</text><text x="550" y="150" font-size="23" fill="#203247" >虚线：终端边，费用 2 − ε</text><text x="550" y="230" font-size="23" fill="#203247" >最优：k 条中心边，费用 k</text><text x="550" y="295" font-size="23" fill="#203247" >算法：(k − 1) 条终端边</text></g></svg>
