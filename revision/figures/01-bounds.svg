<svg xmlns="http://www.w3.org/2000/svg" width="960" height="350" viewBox="0 0 960 350" role="img" aria-labelledby="title desc"><title id="title">LP 松弛的界</title><desc id="desc">扩大可行域后，最大化最优值上升，最小化最优值下降。</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="#536274"/></marker></defs><rect width="960" height="350" fill="white"/><g font-family="PingFang SC, Arial, sans-serif"><rect x="20" y="30" width="250" height="72" rx="12" fill="#eaf2f9" stroke="#245b91" stroke-width="2"/><text x="145" y="73" font-size="22" fill="#203247" text-anchor="middle">整数可行解</text><rect x="385" y="30" width="250" height="72" rx="12" fill="#eaf2f9" stroke="#245b91" stroke-width="2"/><text x="510" y="73" font-size="22" fill="#203247" text-anchor="middle">LP 可行解</text><line x1="275" y1="66" x2="375" y2="66" stroke="#536274" stroke-width="3" marker-end="url(#arrow)"/><text x="705" y="74" font-size="23" fill="#203247" >范围扩大</text><text x="60" y="165" font-size="26" fill="#245b91" >最大化</text><text x="310" y="165" font-size="29" fill="#203247" >ALG ≤ OPT ≤ OPT_LP</text><text x="60" y="235" font-size="26" fill="#19766e" >最小化</text><text x="310" y="235" font-size="29" fill="#203247" >OPT_LP ≤ OPT ≤ ALG</text><text x="60" y="302" font-size="23" fill="#203247" >ALG 仍须是原问题中的可行整数解。</text></g></svg>
