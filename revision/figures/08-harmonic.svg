<svg xmlns="http://www.w3.org/2000/svg" width="960" height="350" viewBox="0 0 960 350" role="img" aria-labelledby="title desc"><title id="title">调和数的分母变化</title><desc id="desc">某闭邻域还剩四、三、二、一个顶点时，比较候选的单位费用界依次增大。</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="#536274"/></marker></defs><rect width="960" height="350" fill="white"/><g font-family="PingFang SC, Arial, sans-serif"><rect x="65" y="220" width="145" height="40" fill="#eaf2f9" stroke="#245b91" stroke-width="2"/><text x="137" y="305" font-size="23" fill="#203247" text-anchor="middle">剩 4 个</text><text x="137" y="200" font-size="24" fill="#245b91" text-anchor="middle">cᵥ / 4</text><rect x="290" y="206.66666666666666" width="145" height="53.333333333333336" fill="#eaf2f9" stroke="#245b91" stroke-width="2"/><text x="362" y="305" font-size="23" fill="#203247" text-anchor="middle">剩 3 个</text><text x="362" y="186.66666666666666" font-size="24" fill="#245b91" text-anchor="middle">cᵥ / 3</text><rect x="515" y="180" width="145" height="80" fill="#eaf2f9" stroke="#245b91" stroke-width="2"/><text x="587" y="305" font-size="23" fill="#203247" text-anchor="middle">剩 2 个</text><text x="587" y="160" font-size="24" fill="#245b91" text-anchor="middle">cᵥ / 2</text><rect x="740" y="100" width="145" height="160" fill="#fff1eb" stroke="#245b91" stroke-width="2"/><text x="812" y="305" font-size="23" fill="#203247" text-anchor="middle">剩 1 个</text><text x="812" y="80" font-size="24" fill="#245b91" text-anchor="middle">cᵥ / 1</text></g></svg>
