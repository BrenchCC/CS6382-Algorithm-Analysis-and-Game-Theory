<svg xmlns="http://www.w3.org/2000/svg" width="960" height="400" viewBox="0 0 960 400" role="img" aria-labelledby="title desc"><title id="title">双资源背包的 LP 可行域</title><desc id="desc">取 delta 等于二分之一。整数最优点在坐标轴上，LP 最优点为三分之二、三分之二。</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="#536274"/></marker></defs><rect width="960" height="400" fill="white"/><g font-family="PingFang SC, Arial, sans-serif"><polygon points="130,335 130,95 290,175 370,335" fill="#eaf2f9" stroke="#245b91" stroke-width="3"/><line x1="130" y1="335" x2="450" y2="335" stroke="#536274" stroke-width="3" marker-end="url(#arrow)"/><line x1="130" y1="335" x2="130" y2="35" stroke="#536274" stroke-width="3" marker-end="url(#arrow)"/><text x="456" y="343" font-size="22" fill="#203247" >x₁</text><text x="105" y="32" font-size="22" fill="#203247" >x₂</text><text x="108" y="365" font-size="22" fill="#203247" >0</text><text x="365" y="365" font-size="22" fill="#203247" >1</text><text x="90" y="102" font-size="22" fill="#203247" >1</text><circle cx="290" cy="175" r="8" fill="#b94f3d"/><text x="310" y="165" font-size="23" fill="#b94f3d" >(2/3, 2/3)</text><text x="170" y="288" font-size="24" fill="#245b91" >可行域</text><text x="520" y="80" font-size="25" fill="#203247" >δ = 1/2，A = B = 1</text><text x="520" y="140" font-size="25" fill="#203247" >x₁ + x₂/2 ≤ 1</text><text x="520" y="190" font-size="25" fill="#203247" >x₁/2 + x₂ ≤ 1</text><text x="520" y="255" font-size="25" fill="#19766e" >整数最优值：1</text><text x="520" y="305" font-size="25" fill="#b94f3d" >LP 最优值：4/3</text><text x="520" y="355" font-size="24" fill="#203247" >向下取整后：(0, 0)</text></g></svg>
