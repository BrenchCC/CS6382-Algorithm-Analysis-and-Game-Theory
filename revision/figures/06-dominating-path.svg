<svg xmlns="http://www.w3.org/2000/svg" width="960" height="350" viewBox="0 0 960 350" role="img" aria-labelledby="title desc"><title id="title">忽略费用的三顶点反例</title><desc id="desc">路径两端费用一，中心费用 L；忽略费用会选中心，最优选择两端。</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="#536274"/></marker></defs><rect width="960" height="350" fill="white"/><g font-family="PingFang SC, Arial, sans-serif"><line x1="180" y1="130" x2="480" y2="130" stroke="#536274" stroke-width="3" /><line x1="480" y1="130" x2="780" y2="130" stroke="#536274" stroke-width="3" /><circle cx="180" cy="130" r="27" fill="#eaf2f9" stroke="#245b91" stroke-width="2"/><text x="180" y="137" font-size="21" fill="#203247" text-anchor="middle">a</text><circle cx="480" cy="130" r="27" fill="#fff1eb" stroke="#245b91" stroke-width="2"/><text x="480" y="137" font-size="21" fill="#203247" text-anchor="middle">b</text><circle cx="780" cy="130" r="27" fill="#eaf2f9" stroke="#245b91" stroke-width="2"/><text x="780" y="137" font-size="21" fill="#203247" text-anchor="middle">c</text><text x="150" y="200" font-size="24" fill="#203247" >费用 1</text><text x="440" y="200" font-size="24" fill="#b94f3d" >费用 L</text><text x="750" y="200" font-size="24" fill="#203247" >费用 1</text><text x="90" y="285" font-size="25" fill="#203247" >中心覆盖 3 点；两端各覆盖 2 点。ALG / OPT = L / 2。</text></g></svg>
