<svg id="my-svg" width="100%" xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" class="flowchart" style="max-width: 356px; background-color: white;" viewBox="4 4 356 446" role="graphics-document document" aria-roledescription="flowchart-v2" aria-describedby="chart-desc-my-svg" aria-labelledby="chart-title-my-svg"><title id="chart-title-my-svg">Terminal MST Construction Steps</title><desc id="chart-desc-my-svg">Start from the original graph, build the terminal distance graph, take an MST, expand shortest paths, then remove cycles.</desc><style>#my-svg{font-family:PingFang SC;font-size:22px;fill:#203247;}@keyframes edge-animation-frame{from{stroke-dashoffset:0;}}@keyframes dash{to{stroke-dashoffset:0;}}#my-svg .edge-animation-slow{stroke-dasharray:9,5!important;stroke-dashoffset:900;animation:dash 50s linear infinite;stroke-linecap:round;}#my-svg .edge-animation-fast{stroke-dasharray:9,5!important;stroke-dashoffset:900;animation:dash 20s linear infinite;stroke-linecap:round;}#my-svg .error-icon{fill:hsl(28, 55.5555555556%, 99.7058823529%);}#my-svg .error-text{fill:rgb(0.3333333334, 0.7777777779, 1.1666666668);stroke:rgb(0.3333333334, 0.7777777779, 1.1666666668);}#my-svg .edge-thickness-normal{stroke-width:1px;}#my-svg .edge-thickness-thick{stroke-width:3.5px;}#my-svg .edge-pattern-solid{stroke-dasharray:0;}#my-svg .edge-thickness-invisible{stroke-width:0;fill:none;}#my-svg .edge-pattern-dashed{stroke-dasharray:3;}#my-svg .edge-pattern-dotted{stroke-dasharray:2;}#my-svg .marker{fill:#536274;stroke:#536274;}#my-svg .marker.cross{stroke:#536274;}#my-svg svg{font-family:PingFang SC;font-size:22px;}#my-svg p{margin:0;}#my-svg .label{font-family:PingFang SC;color:#203247;}#my-svg .cluster-label text{fill:rgb(0.3333333334, 0.7777777779, 1.1666666668);}#my-svg .cluster-label span{color:rgb(0.3333333334, 0.7777777779, 1.1666666668);}#my-svg .cluster-label span p{background-color:transparent;}#my-svg .label text,#my-svg span{fill:#203247;color:#203247;}#my-svg .node rect,#my-svg .node circle,#my-svg .node ellipse,#my-svg .node polygon,#my-svg .node path{fill:#eaf2f9;stroke:#245b91;stroke-width:1px;}#my-svg .rough-node .label text,#my-svg .node .label text,#my-svg .image-shape .label,#my-svg .icon-shape .label{text-anchor:middle;}#my-svg .node .katex path{fill:#000;stroke:#000;stroke-width:1px;}#my-svg .rough-node .label,#my-svg .node .label,#my-svg .image-shape .label,#my-svg .icon-shape .label{text-align:center;}#my-svg .node.clickable{cursor:pointer;}#my-svg .root .anchor path{fill:#536274!important;stroke-width:0;stroke:#536274;}#my-svg .arrowheadPath{fill:#0b0b0b;}#my-svg .edgePaths .path{stroke:#536274;stroke-width:1px;}#my-svg .flowchart-link{stroke:#536274;fill:none;}#my-svg .edgeLabel{background-color:hsl(88, 55.5555555556%, 94.7058823529%);text-align:center;}#my-svg .edgeLabel p{background-color:hsl(88, 55.5555555556%, 94.7058823529%);}#my-svg .edgeLabel rect{opacity:0.5;background-color:hsl(88, 55.5555555556%, 94.7058823529%);fill:hsl(88, 55.5555555556%, 94.7058823529%);}#my-svg .labelBkg{background-color:rgba(241.9999999999, 249, 233.9999999998, 0.5);}#my-svg .cluster rect{fill:hsl(28, 55.5555555556%, 99.7058823529%);stroke:hsl(28, 15.5555555556%, 89.7058823529%);stroke-width:1px;}#my-svg .cluster text{fill:rgb(0.3333333334, 0.7777777779, 1.1666666668);}#my-svg .cluster span{color:rgb(0.3333333334, 0.7777777779, 1.1666666668);}#my-svg .node .collapsed-indicator{fill:hsl(28, 15.5555555556%, 89.7058823529%);stroke:none;opacity:0.6;}#my-svg .node .collapsed-separator{stroke:hsl(28, 15.5555555556%, 89.7058823529%);stroke-width:0.75px;}#my-svg div.mermaidTooltip{position:absolute;text-align:center;max-width:200px;padding:2px;font-family:PingFang SC;font-size:12px;background:hsl(28, 55.5555555556%, 99.7058823529%);border:1px solid hsl(28, 15.5555555556%, 89.7058823529%);border-radius:2px;pointer-events:none;z-index:100;}#my-svg .flowchartTitleText{text-anchor:middle;font-size:18px;fill:#203247;}#my-svg rec