<svg xmlns="http://www.w3.org/2000/svg" width="960" height="380" viewBox="0 0 960 380" role="img" aria-labelledby="title desc"><title id="title">极点与双向扰动</title><desc id="desc">线段中点可向两侧移动，因此不是极点；尖角无法成为可行域内两个不同点的中点。</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="#536274"/></marker></defs><rect width="960" height="380" fill="white"/><g font-family="PingFang SC, Arial, sans-serif"><polygon points="90,300 120,80 380,65 440,300" fill="#eaf2f9" stroke="#245b91" stroke-width="3"/><line x1="145" y1="190" x2="390" y2="190" stroke="#536274" stroke-width="3" /><circle cx="170" cy="190" r="19" fill="#e9f5f1" stroke="#245b91" stroke-width="2"/><text x="170" y="197" font-size="21" fill="#203247" text-anchor="middle">−</text><circle cx="270" cy="190" r="22" fill="#fff1eb" stroke="#245b91" stroke-width="2"/><text x="270" y="197" font-size="21" fill="#203247" text-anchor="middle">x</text><circle cx="370" cy="190" r="19" fill="#e9f5f1" stroke="#245b91" stroke-width="2"/><text x="370" y="197" font-size="21" fill="#203247" text-anchor="middle">+</text><text x="70" y="340" font-size="22" fill="#203247" >x = [(x − ηd) + (x + ηd)] / 2</text><text x="490" y="100" font-size="25" fill="#203247" >三个分数变量 → 三个未知量</text><text x="490" y="165" font-size="22" fill="#203247" >两个资源等式 → 至多两个独立约束</text><text x="490" y="235" font-size="26" fill="#19766e" >存在非零方向 d</text><text x="490" y="300" font-size="22" fill="#203247" >足够小的 η 保持 0 ≤ xᵢ ± ηdᵢ ≤ 1</text></g></svg>
